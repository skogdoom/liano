<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Liano spike: bench</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10261a; }
      #stats { position: fixed; left: 8px; top: 8px; z-index: 1; padding: 6px 8px; background: rgba(0, 0, 0, 0.6); color: #f4e7c5; font: 12px/1.4 monospace; white-space: pre; pointer-events: none; }
      #stats.failed { color: #ff8c6b; }
      #modes { position: fixed; right: 8px; top: 8px; z-index: 1; font: 13px sans-serif; }
      #modes a { display: inline-block; margin: 0 0 4px 4px; padding: 4px 8px; background: rgba(0, 0, 0, 0.6); color: #f4e7c5; text-decoration: none; }
      #modes a.on { background: #f4e7c5; color: #10261a; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="stats">…</div>
    <div id="modes"></div>
    <script type="module" src="/src/spike/bench.js"></script>
  </body>
</html>
