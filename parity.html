  <head>

    <title>Liano parity</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 24px;
        background: #10261a;
        color: #f4e7c5;
        font: 15px sans-serif;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 17px;
        margin-bottom: 4px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;

        margin: 0;
