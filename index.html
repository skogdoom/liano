<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Liano</title>
    <meta
      name="description"
      content="A one-button browser game: swing from vine to vine as a monkey, let go to fly to the next one and dodge what grows in between."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="theme-color" content="#0f2517" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
        /* Taps are game input: no panning, zooming, selection or callouts. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #0b1a10;
        color: #f4e7c5;
        font: bold 20px system-ui, sans-serif;
        visibility: hidden;
        animation: loading-show 0s 250ms forwards;
      }
      #loading[hidden] { display: none; }
      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #354b2d;
        border-top-color: #e7b854;
        border-radius: 50%;
        animation: loading-spin 900ms linear infinite;
      }
      @keyframes loading-show { to { visibility: visible; } }
      @keyframes loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner { animation: none; }
      }
      /* Full-screen messages over the canvas: a passing notice (e.g. restoring
         graphics) and a fatal error. */
      #notice,
      #fatal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0b1a10;
        color: #f4e7c5;
        font: bold 24px sans-serif;
        text-align: center;
        padding: 24px;
      }
      #notice,
      #fatal {
        z-index: 2;
      }
      #notice {
        background: rgba(11, 26, 16, 0.85);
      }
      #notice.shown,
      #fatal.shown {
        display: flex;
      }
      #fatal button {
        font: bold 22px sans-serif;
        color: #0b1a10;
        background: #f4e7c5;
        border: 0;
        border-radius: 12px;
        padding: 14px 28px;
        cursor: pointer;
      }
    </style>
    <script>
      // The bundled entry can fail before its own error boundary downloads.
      {
        const controller = new AbortController();
        window.__loadingErrorController = controller;
        window.addEventListener('error', (event) => {
          const script = event.target;
          if (script?.tagName !== 'SCRIPT' || script.type !== 'module' || new URL(script.src).origin !== location.origin) return;
          const show = () => {
            document.getElementById('loading').hidden = true;
            document.getElementById('fatal').classList.add('shown');
            document.querySelector('#fatal button').onclick = () => location.reload();
            controller.abort();
            delete window.__loadingErrorController;
          };
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show, { once: true });
          else show();
        }, { capture: true, signal: controller.signal });
      }
    </script>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading…</span>
    </div>
    <div id="notice" role="status"></div>
    <div id="fatal" role="alert">
      <span id="fatal-message">Something went wrong.</span>
      <button type="button">Tap to reload</button>
    </div>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
