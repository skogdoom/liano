<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Liano</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="theme-color" content="#0f2517" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
        /* Taps are game input: no panning, zooming, selection or callouts. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      /* Shown on touch devices held upright; the game pauses meanwhile (src/pause.js). */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0b1a10;
        color: #f4e7c5;
        font: bold 24px sans-serif;
        text-align: center;
        padding: 24px;
      }
      #rotate svg {
        width: 96px;
        height: 96px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 96 96" fill="none" stroke="#f4e7c5" stroke-width="5" stroke-linecap="round" aria-hidden="true">
        <rect x="30" y="12" width="36" height="62" rx="6" />
        <path d="M78 58a30 30 0 0 1-22 26" />
        <path d="M58 76l-4 9 9 1" />
      </svg>
      Turn your device sideways to play
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
