<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Liano</title>
    <meta
      name="description"
      content="A one-button browser game: swing from vine to vine as a monkey, let go to fly to the next one and dodge what grows in between."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="theme-color" content="#0f2517" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
        /* Taps are game input: no panning, zooming, selection or callouts. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      /* Full-screen messages over the canvas: a passing notice (e.g. restoring
         graphics) and a fatal error. */
      #notice,
      #fatal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0b1a10;
        color: #f4e7c5;
        font: bold 24px sans-serif;
        text-align: center;
        padding: 24px;
      }
      #notice,
      #fatal {
        z-index: 2;
      }
      #notice {
        background: rgba(11, 26, 16, 0.85);
      }
      #notice.shown,
      #fatal.shown {
        display: flex;
      }
      #fatal button {
        font: bold 22px sans-serif;
        color: #0b1a10;
        background: #f4e7c5;
        border: 0;
        border-radius: 12px;
        padding: 14px 28px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="notice" role="status"></div>
    <div id="fatal" role="alert">
      Something went wrong.
      <button type="button">Tap to reload</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
