# Tests and builds every pull request and push to master, and runs the browser tests;
# pushes to master are also published to GitHub Pages (https://skogdoom.github.io/liano/).
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the custom art
        run: npm run art:check
      - run: npm run build
      # The build regenerates the release-window table; it must match the committed one.
      - name: Check the window table is up to date
        run: git diff --exit-code -- src/sim/windowTable.json
      - name: Upload the site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Smoke tests of the game in Chromium (see playwright.config.js). Separate from the
  # unit tests, which stay fast and Node-only.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The build also builds the art (public/art/, not committed) the dev server serves.
      - run: npm run build
      - run: npm run test:browser

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; let a running one finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
