# Tests and builds every pull request and push to master, and runs the browser tests;
# pushes to master are also published to GitHub Pages (https://skogdoom.github.io/liano/).
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Browser checks to run (Playwright file or title filters); empty runs them all
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The unit tests with Node coverage, and each test's time (reports/unit.json).
      - run: npm run coverage -- --reporter=default --reporter=json --outputFile.json=reports/unit.json
      - name: Summarize the unit timings
        if: always()
        run: node scripts/report-timings.mjs unit
      - name: Keep the unit timings and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-report
          path: |
            reports/
            coverage/
          retention-days: 30
      - name: Check the custom art
        run: npm run art:check
      - run: npm run build
      # The build regenerates the release-window table; it must match the committed one.
      - name: Check the window table is up to date
        run: git diff --exit-code -- src/sim/windowTable.json
      - name: Upload the site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Smoke tests of the game in Chromium (see playwright.config.js). Separate from the
  # unit tests, which stay fast and Node-only.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The build also builds the art (public/art/, not committed) the dev server serves.
      # The art depends only on art/, src/art/ and its build script with their packages,
      # so it is cached on those; the unit job above always builds it from scratch, checks
      # it, and builds the site Pages publishes. The window table is the committed one,
      # whose freshness the unit job checks.
      - name: Restore the built art
        id: art
        uses: actions/cache@v6
        with:
          path: public/art
          key: art-${{ runner.os }}-${{ hashFiles('art/**', 'src/art/**', 'scripts/build-art.mjs', 'package-lock.json') }}
      - name: Build the art
        if: steps.art.outputs.cache-hit != 'true'
        run: npm run art:build
      - name: Build the game
        run: npx vite build
      - run: npm run test:browser -- $BROWSER_TESTS
        env:
          BROWSER_TESTS: ${{ inputs.browser_tests }}
      # Each check's time and attempts (reports/browser.json), and traces of failures.
      - name: Summarize the browser timings and retries
        if: always()
        run: node scripts/report-timings.mjs browser
      - name: Keep the browser timings and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report
          path: |
            reports/
            test-results/
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; let a running one finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
